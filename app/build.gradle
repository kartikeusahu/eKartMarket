plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.ekartmarket'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.ekartmarket"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.firebase.database
    implementation libs.firebase.auth
    implementation libs.google.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

        // Retrofit
        implementation 'com.squareup.retrofit2:retrofit:3.0.0' // Use the latest stable version

        // Converter (e.g., Gson for JSON)
        implementation 'com.squareup.retrofit2:converter-gson:3.0.0' // Use the same version as Retrofit


        // OkHttp logging interceptor (optional, but highly recommended for debugging)
        implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0' // Use the same version as OkHttp
    implementation ("com.github.bumptech.glide:glide:4.16.0")
    annotationProcessor ("com.github.bumptech.glide:compiler:4.16.0")
    
}